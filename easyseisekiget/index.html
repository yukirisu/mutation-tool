<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成績証明書 科目抽出ツール</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mutation Tool Suite は、構造アラインメントや変異生成を支援する研究用Webツール群です。構造情報に基づいた合理的なタンパク質設計をサポートします。">
  <meta name="keywords" content="Mutation Tool, 構造アラインメント, タンパク質変異, Bioinformatics, AI設計, Yukirisu, 雪リス, ユキリス, ゆきりす">
  <meta name="author" content="Yukirisu; 雪リス; ユキリス; ゆきりす">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://yukirisu.github.io/">
  <title>Yukirisu Mutation Tool Site</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Yukirisu Mutation Tool Site">
  <meta property="og:description" content="構造アラインメントや変異生成を支援する研究用Webツール群。構造情報に基づいた合理的なタンパク質設計をサポートします。">
  <meta property="og:url" content="https://yukirisu.github.io/">
  <meta property="og:site_name" content="Yukirisu Mutation Tool Site">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Yukirisu Mutation Tool Site">
  <meta name="twitter:description" content="構造アラインメントや変異生成を支援する研究用Webツール群。">

  <!-- AdSense Auto ads（発行者ID: ca-pub-9022390205190129）※headに1回だけ -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9022390205190129" crossorigin="anonymous"></script>

  <!-- JSON-LD 構造化データ：検索エンジン用（画面には非表示） -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://yukirisu.github.io/#website",
        "url": "https://yukirisu.github.io/",
        "name": "Yukirisu Mutation Tool Site",
        "alternateName": ["yukirisu","雪リス","ユキリス","ゆきりす"],
        "inLanguage": "ja"
      },
      {
        "@type": "WebPage",
        "@id": "https://yukirisu.github.io/#webpage",
        "url": "https://yukirisu.github.io/",
        "name": "Yukirisu Mutation Tool Site",
        "isPartOf": { "@id": "https://yukirisu.github.io/#website" },
        "inLanguage": "ja",
        "about": {
          "@type": "Thing",
          "name": "Mutation Tool Suite"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://yukirisu.github.io/#org",
        "name": "Yukirisu",
        "alternateName": ["雪リス","ユキリス","ゆきりす","yukirisu"],
        "url": "https://yukirisu.github.io/",
        "sameAs": [
          "https://note.com/yukirisulove_",
          "https://x.com/da5zp9esguiolrr?s=11"
        ]
      }
    ]
  }
  </script>
</head>

  <main>

    <p class="page-desc">
      成績証明書（JPEG・PNG・PDF）をアップロードすると、科目名・成績を自動抽出します
    </p>

    <!-- Upload zone -->
    <div id="drop-zone" role="button" tabindex="0"
         aria-label="ファイルをドロップ、またはクリックして選択">
      <div class="drop-icon">📄</div>
      <p class="drop-main">ここにファイルをドロップ</p>
      <p class="drop-sub">または クリックして選択（JPEG・PNG・PDF）</p>
    </div>
    <input id="file-input" type="file"
           accept="image/jpeg,image/png,application/pdf"
           style="display:none" aria-hidden="true" />

    <!-- Image preview -->
    <div id="preview-wrap">
      <img id="preview-img" alt="アップロードした画像のプレビュー" />
    </div>

    <!-- Display options -->
    <div class="options-bar" role="group" aria-label="表示項目の選択">
      <span class="options-label">表示項目：</span>
      <label>
        <input type="checkbox" id="opt-grades" checked />
        成績
      </label>
      <label>
        <input type="checkbox" id="opt-credits" checked />
        単位数
      </label>
      <label>
        <input type="checkbox" id="opt-semester" />
        学期
      </label>
    </div>

    <!-- Extract button -->
    <button id="btn-extract" disabled>科目を抽出する</button>

    <!-- Error -->
    <div id="error-box" role="alert"></div>

    <!-- Results -->
    <div id="results">

      <!-- Meta cards (学校名・氏名・年度) -->
      <div id="meta-grid"></div>

      <!-- Bulk copy -->
      <div id="bulk-copy-bar" class="bulk-copy-bar"></div>

      <!-- Subject table -->
      <div id="subject-table-wrap">
        <div id="tbl-head" class="tbl-head"></div>
        <div id="tbl-body"></div>
      </div>

      <p id="subject-count"></p>

    </div><!-- /results -->

  </main>

  <!-- ========================================================
       ここにご自身のフッターを挿入してください
       例: <footer>...</footer>
       ======================================================== -->

  <!-- Fallback copy modal -->
  <div id="copy-modal-overlay" role="dialog" aria-modal="true"
       aria-label="テキストを手動コピー">
    <div id="copy-modal">
      <p>全選択して <kbd>Ctrl+C</kbd> / <kbd>⌘C</kbd> でコピーしてください</p>
      <textarea id="modal-textarea" readonly></textarea>
      <button id="btn-modal-close" class="btn-modal-close">閉じる</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
